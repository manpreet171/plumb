<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0b1a24"/>
    </linearGradient>
    <linearGradient id="bob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="880" cy="300" rx="420" ry="330" fill="url(#glow)"/>

  <!-- the wall the agent built: code lines, four degrees out of true -->
  <g transform="rotate(-4.2 1010 330)" stroke-linecap="round">
    <g stroke="#64748b" stroke-opacity="0.5" stroke-width="9">
      <path d="M912 150h236M912 186h180M912 222h262M912 258h150M912 294h224"/>
      <path d="M912 330h196M912 366h248M912 402h164M912 438h210M912 474h176"/>
    </g>
    <!-- the lines it never mentioned -->
    <g stroke="#f87171" stroke-opacity="0.85" stroke-width="9">
      <path d="M912 258h150M912 402h164"/>
    </g>
    <line x1="906" y1="132" x2="906" y2="492" stroke="#475569" stroke-width="2" stroke-dasharray="2 6"/>
  </g>

  <!-- the plumb line: true, whatever the wall says -->
  <g>
    <circle cx="860" cy="96" r="6" fill="#22d3ee"/>
    <circle cx="860" cy="96" r="13" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.5"/>
    <line x1="860" y1="102" x2="860" y2="430" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M860 430 L877 456 L860 540 L843 456 Z" fill="url(#bob)"/>
    <path d="M860 430 L877 456 L860 540" fill="#000" fill-opacity="0.22"/>
    <line x1="843" y1="456" x2="877" y2="456" stroke="#071018" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- the gap is the product -->
  <g stroke="#fbbf24" stroke-width="1.5" fill="none">
    <line x1="860" y1="566" x2="860" y2="596"/>
    <line x1="951" y1="512" x2="951" y2="596"/>
    <line x1="860" y1="584" x2="951" y2="584"/>
    <path d="M868 579l-8 5 8 5M943 579l8 5-8 5" stroke-linejoin="round"/>
  </g>
  <text x="905" y="616" fill="#fbbf24" font-size="15" letter-spacing="1" text-anchor="middle">out of true</text>

  <!-- annotation callouts, blueprint style -->
  <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M860 96h-96"/><circle cx="758" cy="96" r="3" fill="#22d3ee" stroke="none"/>
    <path d="M1090 412l64 78" stroke="#f87171" stroke-opacity="0.5"/><circle cx="1090" cy="412" r="3" fill="#f87171" stroke="none"/>
  </g>
  <text x="748" y="91" fill="#94a3b8" font-size="15" text-anchor="end">the summary</text>
  <text x="748" y="112" fill="#64748b" font-size="14" text-anchor="end">"updated auth.ts and the tests"</text>
  <text x="1216" y="516" fill="#f87171" font-size="16" text-anchor="end">2 changes it</text>
  <text x="1216" y="538" fill="#f87171" font-size="16" text-anchor="end">never mentioned</text>

  <!-- wordmark -->
  <text x="80" y="330" fill="#f8fafc" font-size="104" font-weight="700" letter-spacing="8">PLUMB</text>
  <rect x="84" y="364" width="88" height="4" fill="#22d3ee"/>
  <text x="80" y="416" fill="#e2e8f0" font-size="27" letter-spacing="0.5">What it said. What it did.</text>
  <text x="80" y="456" fill="#64748b" font-size="17">Hold the agent's summary against the diff.</text>

  <!-- footer strip -->
  <line x1="80" y1="536" x2="640" y2="536" stroke="#1e3a47" stroke-width="1"/>
  <text x="80" y="566" fill="#64748b" font-size="15" letter-spacing="2">AFTER IT'S DONE</text>
  <text x="272" y="566" fill="#334e5c" font-size="15" letter-spacing="2">·</text>
  <text x="292" y="566" fill="#64748b" font-size="15" letter-spacing="2">ZERO DEPS</text>
  <text x="424" y="566" fill="#334e5c" font-size="15" letter-spacing="2">·</text>
  <text x="444" y="566" fill="#64748b" font-size="15" letter-spacing="2">MIT</text>
</svg>
